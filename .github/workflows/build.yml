name: Build IntelEngine.dll

on:
  workflow_dispatch:
  push:
    branches: [ "fix/**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare report dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path out | Out-Null

      - name: Configure
        id: configure
        shell: pwsh
        working-directory: SKSE
        continue-on-error: true
        run: |
          $tc = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$tc" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded 2>&1 | Tee-Object -FilePath ../out/configure.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        id: build
        if: steps.configure.outcome == 'success'
        shell: pwsh
        working-directory: SKSE
        continue-on-error: true
        run: |
          cmake --build build --config Release -- -k 0 2>&1 | Tee-Object -FilePath ../out/build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Collect outputs
        if: always()
        shell: pwsh
        run: |
          "configure=${{ steps.configure.outcome }} build=${{ steps.build.outcome }} sha=${{ github.sha }}" | Out-File out/report.txt
          if (Test-Path SKSE/build/IntelEngine.dll) { Copy-Item SKSE/build/IntelEngine.dll out/IntelEngine.dll }
          foreach ($f in 'configure.log','build.log') {
            if (Test-Path "out/$f") {
              Select-String -Path "out/$f" -Pattern 'error C\d+|error:|fatal error|FAILED:|CMake Error|LNK\d+' | Select-Object -First 250 | ForEach-Object { $_.Line } | Set-Content "out/$f.errors.txt"
              Get-Content "out/$f" -Tail 80 | Set-Content "out/$f.tail.txt"
              Remove-Item "out/$f"
            }
          }
          Get-ChildItem SKSE/build -Recurse -Filter 'vcpkg-manifest-install.log' -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { Get-Content $_.FullName -Tail 120 | Set-Content out/vcpkg-install.tail.txt }

      - name: Publish outputs to ci-artifacts branch
        if: always()
        shell: pwsh
        working-directory: out
        run: |
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-artifacts
          git add -A
          git commit -q -m "CI outputs for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-artifacts
